---
name: Build the plugin
on: [ push ]
jobs:
  install-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache maven repository
        id: cache-mvn
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven


      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Maven
        uses: stCarolas/setup-maven@v5

      - uses: SpraxDev/Action-SpigotMC@v4
        with:
          versions: 1.21.5
          remapped: true
          buildToolProvider: SpigotMC

      - uses: SpraxDev/Action-SpigotMC@v4
        with:
          versions: 1.21.4
          remapped: true
          buildToolProvider: SpigotMC

      - uses: SpraxDev/Action-SpigotMC@v4
        with:
          versions: 1.21.3
          remapped: true
          buildToolProvider: SpigotMC

      - uses: actions/checkout@v4
        with:
          repository: 'nulli0n/nightcore-spigot'
          ref: 'v2.7.5.2'
          path: 'nightcore'

      - name: Install nightcore
        run: mvn install
        working-directory: ./nightcore

  ci:
    runs-on: ubuntu-latest
    needs: [ install-dependencies ]
    strategy:
      matrix:
        spigot:
          - 1.21.3-R0.1-SNAPSHOT
          - 1.21.4-R0.1-SNAPSHOT
          - 1.21.5-R0.1-SNAPSHOT
    steps:
      - uses: actions/checkout@v4

      - name: Cache maven repository
        id: cache-mvn
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Maven
        uses: stCarolas/setup-maven@v5

      - name: Package plugin
        run: mvn package -Dspigot.version=${{ matrix.spigot }}

  build:
    runs-on: ubuntu-latest
    needs: [ install-dependencies ]
    steps:
      - uses: actions/checkout@v4

      - name: Cache maven repository
        id: cache-mvn
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Maven
        uses: stCarolas/setup-maven@v5

      - name: Package plugin
        run: mvn package

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExcellentEnchants
          path: target/*.jar